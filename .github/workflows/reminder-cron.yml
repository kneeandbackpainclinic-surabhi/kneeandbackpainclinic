name: 30-Minute Consultation Reminder Cron

on:
  schedule:
    # Runs every 10 minutes (UTC) to sweep for upcoming 30-minute consultation reminders
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sweep-reminders:
    name: Run 30-Min Reminder Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Ping Clinic Reminder Sweep Endpoint
        run: |
          echo "Starting 30-minute consultation reminder sweep at $(date)..."
          RESPONSE=$(curl -sS -X GET "https://kneeandbackpainclinic.vercel.app/api/send-reminders")
          echo "Sweep result: $RESPONSE"
