name: 30-Minute Consultation Reminder Cron

on:
  schedule:
    # Run every 15 minutes around the clock
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sweep-reminders:
    name: Sweep Due Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Ping Send Reminders Endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://kneeandbackpainclinic.vercel.app/api/send-reminders")
          echo "$response"
